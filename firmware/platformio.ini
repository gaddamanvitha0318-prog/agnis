[platformio]
default_envs = servo_test

[env:servo_test]
platform = espressif32 @ ^6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter = +<standalone_servo_test.cpp>
build_flags =
    -D CORE_DEBUG_LEVEL=1

[env:motor_test]
platform = espressif32 @ ^6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter = +<standalone_motor_test.cpp>
build_flags =
    -D CORE_DEBUG_LEVEL=1

[env:esp32dev]
platform = espressif32 @ ^6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter = +<*> -<standalone_motor_test.cpp> -<standalone_servo_test.cpp>

lib_deps =
    adafruit/Adafruit MPU6050 @ ^2.2.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    mikalhart/TinyGPSPlus @ ^1.0.3
    https://github.com/me-no-dev/AsyncTCP.git
    https://github.com/me-no-dev/ESPAsyncWebServer.git
    bblanchon/ArduinoJson @ ^7.0.4

build_flags =
    -D CORE_DEBUG_LEVEL=1
    -I include
