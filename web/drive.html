<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AGNIS-4WD — DRIVE CONTROL</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <header class="navbar">
            <div class="brand-title">AGNIS <span class="brand-accent">DRIVE</span></div>
            <div class="status-badge" id="safety-badge">MANUAL</div>
        </header>

        <!-- Mode Selector -->
        <div class="card">
            <div class="mode-selector">
                <button class="mode-btn active" id="btn-manual" onclick="setMode('MANUAL')">MANUAL</button>
                <button class="mode-btn" id="btn-assist" onclick="setMode('ASSIST')">ASSIST</button>
                <button class="mode-btn" id="btn-auto" onclick="setMode('AUTO')">AUTO</button>
            </div>
        </div>

        <!-- Virtual Joystick Card -->
        <div class="card">
            <div class="card-header">
                <span class="card-title">Differential Steering Joystick</span>
                <span id="speed-indicator" style="font-size: 0.8rem; color: var(--accent-cyan);">SPEED: 0%</span>
            </div>
            <div class="joystick-container" id="joy-zone">
                <div class="joystick-knob" id="joy-knob"></div>
            </div>
        </div>

        <!-- Telemetry Summary Grid -->
        <div class="grid-2x2">
            <div class="metric-box">
                <span class="metric-label">Front Dist</span>
                <span class="metric-value" id="val-df">-- <span class="metric-unit">cm</span></span>
            </div>
            <div class="metric-box">
                <span class="metric-label">Rear Dist</span>
                <span class="metric-value" id="val-dr">-- <span class="metric-unit">cm</span></span>
            </div>
            <div class="metric-box">
                <span class="metric-label">Battery</span>
                <span class="metric-value" id="val-v">-- <span class="metric-unit">V</span></span>
            </div>
            <div class="metric-box">
                <span class="metric-label">Comm Status</span>
                <span class="metric-value" id="val-comm" style="color: var(--status-green);">OK</span>
            </div>
        </div>

        <!-- Emergency Stop -->
        <button class="estop-btn" onclick="triggerEstop()">🛑 EMERGENCY STOP</button>
    </div>

    <script src="js/app.js"></script>
    <script src="js/drive.js"></script>
</body>
</html>
